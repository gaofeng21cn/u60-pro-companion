name: U60 host validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
          cache-dependency-path: web/controller/go.sum
      - name: Select the reproducible Rust host toolchain
        run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - name: Run native host regressions
        run: sh scripts/test.sh
